<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Yex Ling">
  <defs>
    <linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecae45"/>
      <stop offset="52%" stop-color="#db6230"/>
      <stop offset="100%" stop-color="#b23f2c"/>
    </linearGradient>
    <clipPath id="circ"><circle cx="50" cy="50" r="50"/></clipPath>
  </defs>
  <g clip-path="url(#circ)">
    <rect width="100" height="100" fill="url(#dawn)"/>
    <!-- rising sun -->
    <circle cx="50" cy="45" r="16.5" fill="#fbf3e2"/>
    <!-- light bands / horizon -->
    <rect x="15" y="67" width="70" height="3.6" rx="1.8" fill="#fbf3e2" opacity="0.92"/>
    <rect x="25" y="77.5" width="50" height="3.6" rx="1.8" fill="#fbf3e2" opacity="0.62"/>
    <rect x="35" y="88" width="30" height="3.6" rx="1.8" fill="#fbf3e2" opacity="0.38"/>
  </g>
  <circle cx="50" cy="50" r="49" fill="none" stroke="#000" stroke-opacity="0.10" stroke-width="2"/>
</svg>
