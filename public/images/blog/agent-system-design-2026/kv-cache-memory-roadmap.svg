<svg width="1200" height="780" viewBox="0 0 1200 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">KV cache 从推理缓存走向运行时记忆</title>
  <desc id="desc">KV cache 从基础复用、分页调度、前缀复用、跨引擎共享，走向分层、压缩和失效治理。</desc>
  <rect width="1200" height="780" fill="#f8f6f0"/>
  <text x="72" y="72" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700" fill="#1e1e1a">KV cache 从推理缓存走向运行时记忆</text>
  <text x="72" y="112" font-family="Inter, Arial, sans-serif" font-size="18" fill="#5b5b52">这条线不替代 RAG，但会改变长上下文和检索材料进入模型的方式。</text>

  <g font-family="Inter, Arial, sans-serif">
    <line x1="118" y1="210" x2="1082" y2="210" stroke="#6d776f" stroke-width="4"/>

    <g>
      <circle cx="168" cy="210" r="14" fill="#386641"/>
      <rect x="70" y="250" width="196" height="138" rx="14" fill="#d8eee2" stroke="#8aac96"/>
      <text x="94" y="286" font-size="19" font-weight="700" fill="#173323">基本 KV cache</text>
      <text x="94" y="318" font-size="14" fill="#385748">
        <tspan x="94" dy="0">复用历史 key/value，</tspan>
        <tspan x="94" dy="22">避免重复计算。</tspan>
        <tspan x="94" dy="22">成本随上下文增长。</tspan>
      </text>
    </g>

    <g>
      <circle cx="384" cy="210" r="14" fill="#5a4f7d"/>
      <rect x="286" y="250" width="196" height="138" rx="14" fill="#e9e1f3" stroke="#a99bc5"/>
      <text x="310" y="286" font-size="19" font-weight="700" fill="#30244a">分页和虚拟内存</text>
      <text x="310" y="318" font-size="14" fill="#56486d">
        <tspan x="310" dy="0">PagedAttention、</tspan>
        <tspan x="310" dy="22">vAttention。</tspan>
        <tspan x="310" dy="22">减少碎片和调度成本。</tspan>
      </text>
    </g>

    <g>
      <circle cx="600" cy="210" r="14" fill="#9a6b24"/>
      <rect x="502" y="250" width="196" height="138" rx="14" fill="#f7e5cf" stroke="#d0aa7a"/>
      <text x="526" y="286" font-size="19" font-weight="700" fill="#4a3114">复用和融合</text>
      <text x="526" y="318" font-size="14" fill="#684b2c">
        <tspan x="526" dy="0">Prefix cache、</tspan>
        <tspan x="526" dy="22">CacheBlend。</tspan>
        <tspan x="526" dy="22">复用已计算表示。</tspan>
      </text>
    </g>

    <g>
      <circle cx="816" cy="210" r="14" fill="#2e5d7d"/>
      <rect x="718" y="250" width="196" height="138" rx="14" fill="#dbe7f6" stroke="#93aac8"/>
      <text x="742" y="286" font-size="19" font-weight="700" fill="#1f344c">跨引擎共享</text>
      <text x="742" y="318" font-size="14" fill="#3d536f">
        <tspan x="742" dy="0">LMCache。</tspan>
        <tspan x="742" dy="22">cache 开始可移动、</tspan>
        <tspan x="742" dy="22">可查找、可清理。</tspan>
      </text>
    </g>

    <g>
      <circle cx="1032" cy="210" r="14" fill="#7d3f54"/>
      <rect x="934" y="250" width="196" height="138" rx="14" fill="#f3dce4" stroke="#c992a5"/>
      <text x="958" y="286" font-size="19" font-weight="700" fill="#4b2432">分层和压缩</text>
      <text x="958" y="318" font-size="14" fill="#6b4351">
        <tspan x="958" dy="0">TTKV、KVDrive、</tspan>
        <tspan x="958" dy="22">KIVI、SnapKV。</tspan>
        <tspan x="958" dy="22">管理冷热和精度。</tspan>
      </text>
    </g>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="126" y="468" width="948" height="184" rx="18" fill="#ffffff" stroke="#cfcac0"/>
    <text x="166" y="514" font-size="24" font-weight="700" fill="#27231c">未来问题</text>
    <text x="166" y="554" font-size="17" fill="#514d45">检索出来的不一定只是文本，也可能是预计算、压缩或分层存放的模型状态。</text>
    <text x="166" y="590" font-size="17" fill="#514d45">但 KV cache 仍是脆弱记忆：它绑定模型、位置、prompt 和精度，难以解释，也难以迁移。</text>
    <text x="166" y="626" font-size="17" fill="#514d45">治理问题会扩展到：保留哪段状态，移动到哪里，什么时候失效。</text>
  </g>
</svg>
